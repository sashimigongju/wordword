<style>
  *{box-sizing:border-box}

  .hint{font-size:13px;color:#4b5563}
  .counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .count-card{background:#fff;border:1px solid #d1d5db;border-radius:7px;padding:8px 11px;font-size:13px}
  .count-card strong{color:#1d4ed8}
  .print-area{display:block}
  .print-page{position:relative;width:210mm;min-height:297mm;margin:12mm auto;background:#fff;padding:5mm 6mm 5mm;box-shadow:0 2px 10px rgba(0,0,0,.12);break-after:page;page-break-after:always}
  .print-page:last-child{break-after:auto;page-break-after:auto}
  .sheet-header{position:relative;border-bottom:1px solid #777;padding-bottom:1.5mm;margin-bottom:1.5mm;min-height:12mm}
  .sheet-title{font-size:12pt;font-weight:800;line-height:1.1;padding-right:62mm;white-space:nowrap}
  .sheet-subtitle{font-size:7pt;color:#444;margin-top:.7mm;line-height:1.15}
  .student-info{position:absolute;right:0;top:0;display:flex;gap:2.5mm;align-items:center;font-size:7pt;white-space:nowrap}
  .student-info label{display:flex;align-items:center;gap:.8mm}
  .student-info input{width:22mm;height:5.5mm;border:1px solid #777;border-radius:1mm;padding:.3mm .8mm;background:#fff}
  .question-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:7mm;align-items:start}
  .question-grid:after{content:"";position:absolute;top:0;bottom:0;left:50%;border-left:1px solid #777;transform:translateX(-3.5mm);pointer-events:none}
  .q-column{min-width:0}
  .q-row{display:grid;grid-template-columns:7mm minmax(0,1fr) 27mm;min-height:8.6mm;border:1px solid #777;border-bottom:0;align-items:stretch;background:#fff}
  .q-column .q-row:last-child{border-bottom:1px solid #777}
  .q-no{display:flex;align-items:center;justify-content:center;border-right:1px solid #777;font-size:8.5pt;font-weight:700;padding:.5mm .5mm}
  .q-prompt{display:flex;align-items:center;gap:1.2mm;padding:.8mm 1.1mm;font-size:8pt;line-height:1.16;overflow-wrap:anywhere;word-break:break-word}
  .q-answer-space{border-left:1px solid #777;background:#fff}
  .type-tag{display:inline-block;flex:none;border:1px solid #9ca3af;border-radius:2px;padding:.2mm .7mm;color:#374151;font-size:6.3pt;line-height:1.1}

  .answer-page .q-prompt{font-size:8.8pt;font-weight:700;line-height:1.1}
  .page-note{font-size:6.5pt;color:#555;margin-top:1.5mm;text-align:right}
  .empty{padding:20mm;text-align:center;color:#6b7280;border:1px dashed #9ca3af}
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}

<section class="screen">

    <button class="btn secondary" id="printBtn" type="button" onclick="window.printAll()" disabled>시험지 + 정답지 인쇄</button>

  </div>

</section>

let CURRENT = [];
const PAGE_CAPACITY = 56;

function esc(value){
  return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;");
}
function selectedChapters(){
  const value = document.getElementById("chapter").value;
  return value === "all" ? ["5","6"] : [value];
}
function kindLabel(kind){
  if(kind === "ko") return "한→영 해석";
  if(kind === "def") return "영영풀이";
  return "한→영 + 영영풀이";
}
function chapterLabel(){
  const value = document.getElementById("chapter").value;
  return value === "all" ? "5·6과 전체" : value + "과";
}
function poolItems(){
  const kind = document.getElementById("kind").value;
  let result = [];
  selectedChapters().forEach(function(chapter){
    const add = function(source, itemKind){
      source.forEach(function(pair){
        result.push({word:pair[0], prompt:pair[1], chapter:chapter, kind:itemKind});
      });
    };
    if(kind === "ko") add(DATA[chapter].ko, "ko");
    else if(kind === "def") add(DATA[chapter].def, "def");
    else {
      add(DATA[chapter].ko, "ko");
      add(DATA[chapter].def, "def");
    }
  });
  return result;
}
function shuffle(items){
  const a = items.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function updateLimit(){
  const list = poolItems();
  const input = document.getElementById("count");
  input.max = list.length;
  if(Number(input.value) > list.length) input.value = list.length;
  if(Number(input.value) < 1 || !Number.isFinite(Number(input.value))) input.value = Math.min(50, list.length);
  document.getElementById("status").textContent = "현재 출제 가능 문항: " + list.length + "개 (" + chapterLabel() + " · " + kindLabel(document.getElementById("kind").value) + ")";
}
function chunks(items, size){
  const result=[];
  for(let i=0;i<items.length;i+=size) result.push(items.slice(i,i+size));
  return result;
}
function makeRows(items, answerMode){
  if(!items.length) return '<div class="empty">출제할 자료가 없습니다.</div>';
  let html="";
  items.forEach(function(item){
    const tag = item.kind === "ko" ? "한→영" : "영영";
    if(answerMode){
      html += '<div class="q-row"><div class="q-no">'+item.number+'</div><div class="q-prompt"><span class="type-tag">'+tag+'</span>'+esc(item.word)+'</div></div>';
    }else{
      html += '<div class="q-row"><div class="q-no">'+item.number+'</div><div class="q-prompt"><span class="type-tag">'+tag+'</span>'+esc(item.prompt)+'</div><div class="q-answer-space" aria-label="답안 공간"></div></div>';
    }
  });
  return html;
}
function renderPage(title, subtitle, items, answerMode, pageNo, totalPages){
  const cols = [items.slice(0, Math.ceil(items.length/2)), items.slice(Math.ceil(items.length/2))];
  const info = answerMode ? "" : '<div class="student-info"><label>이름 <input type="text" aria-label="이름"></label><label>날짜 <input type="text" value="'+todayText()+'" aria-label="날짜"></label></div>';
  return '<div class="print-page '+(answerMode?'answer-page':'exam-page')+'">'
    + '<div class="sheet-header"><div class="sheet-title">'+esc(title)+'</div><div class="sheet-subtitle">'+esc(subtitle)+' · '+pageNo+'/'+totalPages+'쪽</div>'+info+'</div>'
    + '<div class="question-grid"><div class="q-column">'+makeRows(cols[0],answerMode)+'</div><div class="q-column">'+makeRows(cols[1],answerMode)+'</div></div>'
    + '<div class="page-note">동아(윤정미) 개정 중3 · '+chapterLabel()+'</div>'
    + '</div>';
}
function todayText(){
  const d = new Date();
  return d.getFullYear()+". "+String(d.getMonth()+1).padStart(2,"0")+". "+String(d.getDate()).padStart(2,"0")+".";
}
function renderAll(){
  const examChunks = chunks(CURRENT, PAGE_CAPACITY);
  let html = "";
  examChunks.forEach(function(chunk,index){
    html += renderPage("동아(윤정미) 개정 중3 "+chapterLabel()+" 단어시험지", kindLabel(document.getElementById("kind").value)+" · 문제", chunk, false, index+1, examChunks.length);
  });
  examChunks.forEach(function(chunk,index){
    html += renderPage("정답지", "시험지와 같은 순서", chunk, true, index+1, examChunks.length);
  });
  document.getElementById("printArea").innerHTML = html;
}
function generateExam(){
  try{
    let list = poolItems();
    const mode = document.getElementById("mode").value;
    let wanted = parseInt(document.getElementById("count").value,10);
    if(!Number.isFinite(wanted) || wanted < 1) wanted = 1;
    if(wanted > list.length) wanted = list.length;
    document.getElementById("count").value = wanted;
    list = mode === "random" ? shuffle(list).slice(0,wanted) : list.slice(0,wanted);
    CURRENT = list.map(function(item,index){ return Object.assign({}, item, {number:index+1}); });
    renderAll();
    document.getElementById("printBtn").disabled = false;
    const status = document.getElementById("status");
    status.className = "status";
    status.textContent = "시험지와 정답지가 생성되었습니다. " + CURRENT.length + "문항 · " + Math.ceil(CURRENT.length/PAGE_CAPACITY) + "페이지";
  }catch(error){
    const box = document.getElementById("status");
    box.className = "status error";
    box.textContent = "생성 오류: " + error.message;
  }
}
function printAll(){
  if(!CURRENT.length) generateExam();
  window.print();
}
function resetExam(){
  document.getElementById("chapter").value = "5";
  document.getElementById("kind").value = "ko";
  document.getElementById("mode").value = "sequential";
  document.getElementById("count").value = "50";
  updateLimit();
  generateExam();
}
window.updateLimit = updateLimit;
window.generateExam = generateExam;
window.printAll = printAll;
window.resetExam = resetExam;
window.addEventListener("DOMContentLoaded",function(){ updateLimit(); generateExam(); });
</script>
</body>
</html>
